[project]
name = "chopsticks-erp-backend"
version = "0.1.0"
description = "MVP: Orders -> Work Orders -> Factory board -> Print PDF"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "reportlab>=4.0.0",
  "qrcode[pil]>=7.4.2",
  "pillow>=10.0.0",
  "openpyxl>=3.1.0",
]

